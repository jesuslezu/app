<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Códigos de error Samsung</title>
<style>
:root{
  --bg:#000;--panel:#0d0f1a;--panel2:#141831;--line:#232a52;
  --blue:#2f46c8;--blue2:#5b73ff;--text:#eef1ff;--muted:#9aa3d1;
  --kbd-bg:#1c2250;--kbd-line:#33407f;
}
:root[data-theme="light"]{
  --bg:#f3f5ff;--panel:#ffffff;--panel2:#e9edff;--line:#d3daf5;
  --blue:#2f46c8;--blue2:#2f46c8;--text:#12163a;--muted:#566090;
  --kbd-bg:#e8ecff;--kbd-line:#b4c0f4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:720px;margin:0 auto;padding:0 16px 40px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:12px 0 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:700}
header.top small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.theme{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none}
.back{border:1px solid var(--line);background:var(--panel);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:20px;display:none;align-items:center;justify-content:center;flex:none}
.hero{text-align:center;padding:4px 0}
.hero img{width:150px;height:150px;border-radius:24px;display:block;margin:0 auto}
.hero h2{margin:10px 0 2px;font-size:22px}
.hero p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--text);font:inherit;width:100%}
.card:active{background:var(--panel2)}
.card svg{width:92px;height:122px;display:block}
.card b{display:block;font-size:15px;margin-top:8px}
.card span.s{color:var(--muted);font-size:12px;margin-top:2px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#fff;background:var(--blue);margin-top:16px}
.btn.sec{background:var(--panel2);border:1px solid var(--line)}
.catpic{display:flex;justify-content:center;padding:6px 0 2px}
.catpic svg{width:120px;height:160px}
h3{margin:18px 0 8px;font-size:14px;color:var(--blue2);text-transform:uppercase;letter-spacing:.8px}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";margin-left:auto;color:var(--muted);flex:none}
details[open] summary::after{content:"－"}
summary small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:2px}
.body{padding:2px 14px 14px;font-size:14.5px;line-height:1.5}
.body h4{margin:12px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.body p{margin:6px 0}
ol,ul{margin:6px 0 6px 20px;padding:0}
li{margin:5px 0}
kbd{background:var(--kbd-bg);border:1px solid var(--kbd-line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:13px;font-family:inherit;white-space:nowrap}
.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.search:focus{border-color:var(--blue2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 13px;font-size:13px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.code{display:inline-block;min-width:66px;text-align:center;background:var(--blue);border-radius:10px;padding:5px 8px;font-weight:800;font-size:14px;flex:none}
.empty{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="back" id="back" aria-label="Volver">‹</button>
    <div><h1 id="ttl">Códigos de error Samsung</h1><small id="sub">Redsa Service</small></div>
    <button class="theme" id="theme" aria-label="Cambiar modo claro u oscuro"></button>
  </header>
  <main id="view"></main>
</div>

  var m=document.querySelector('meta[name=theme-color]'); if(m)m.setAttribute('content',TEMA==='dark'?'#000000':'#f3f5ff');
}
function cambiarTema(){TEMA=TEMA==='dark'?'light':'dark'; try{localStorage.setItem('tema',TEMA)}catch(e){} aplicarTema();}

/* ---------- Ilustraciones de refrigeradores (sin letras) ---------- */
function fridgeSvg(type){
  var id='g'+type;
  var defs='<defs><linearGradient id="'+id+'" x1="0" x2="1"><stop offset="0" stop-color="#e6e9f5"/><stop offset=".5" stop-color="#b9bfd6"/><stop offset="1" stop-color="#8a92b0"/></linearGradient></defs>';
  var body='<rect x="14" y="6" width="92" height="148" rx="8" fill="url(#'+id+')" stroke="#4a5280" stroke-width="2"/>';
  var line='stroke="#4a5280" stroke-width="2"';
  var hv=function(x,y,h){return '<rect x="'+x+'" y="'+y+'" width="3.6" height="'+h+'" rx="1.8" fill="#2b3150"/>'};
  var hh=function(x,y,w){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="3.6" rx="1.8" fill="#2b3150"/>'};
  var s='';
  if(type==='french'){
    s+='<line x1="60" y1="6" x2="60" y2="98" '+line+'/><line x1="14" y1="98" x2="106" y2="98" '+line+'/>';
    s+=hv(54,40,30)+hv(62.4,40,30)+hh(48,120,24);
  }else if(type==='side'){
    s+='<line x1="46" y1="6" x2="46" y2="154" '+line+'/>';
    s+='<rect x="21" y="40" width="18" height="30" rx="3" fill="#2b3150"/>';
    s+=hv(40,50,40)+hv(51,50,40);
  }else if(type==='top'){
    s+='<line x1="14" y1="52" x2="106" y2="52" '+line+'/>';
    s+=hv(95,20,22)+hv(95,66,40);
  }else if(type==='bottom'){
    s+='<line x1="14" y1="104" x2="106" y2="104" '+line+'/>';
    s+=hv(95,30,40)+hh(46,124,28);
  }else if(type==='multi'){
    s+='<line x1="60" y1="6" x2="60" y2="92" '+line+'/><line x1="14" y1="92" x2="106" y2="92" '+line+'/><line x1="60" y1="92" x2="60" y2="154" '+line+'/>';
    s+=hv(54,36,30)+hv(62.4,36,30)+hh(28,116,24)+hh(68,116,24);
  }else if(type==='hub'){
    s+='<line x1="60" y1="6" x2="60" y2="98" '+line+'/><line x1="14" y1="98" x2="106" y2="98" '+line+'/>';
    s+='<rect x="21" y="22" width="32" height="46" rx="4" fill="#0b1030" stroke="#2f46c8" stroke-width="1.5"/>';
    s+='<rect x="25" y="27" width="11" height="11" rx="2" fill="#5b73ff"/><rect x="38" y="27" width="11" height="11" rx="2" fill="#3ecf8e"/><rect x="25" y="41" width="24" height="7" rx="2" fill="#2f46c8"/><rect x="25" y="52" width="24" height="10" rx="2" fill="#232a52"/>';
    s+=hv(62.4,40,30)+hh(48,120,24);
  }
  return '<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">'+defs+body+s+'</svg>';
}

/* ---------- Lista de códigos de error (1E a 86E y otros) ---------- */
var GROUP_ORDER=["Sensores","Deshielo","Ventiladores","Hielo y agua","Compresor y energía","Comunicación","Temperatura alta","Modos y avisos","Family Hub","Parpadeos LED","Sin documentar"];

function fixSensor(val,extra){
  var a=["Desconecta el refrigerador y revisa que el conector del sensor esté firme, sin humedad ni sulfatación.",
   "Mide la resistencia del sensor desconectado: "+val+". Infinito = sensor abierto; 0 = en corto.",
   "En la tarjeta main el voltaje del sensor debe estar entre 4.5 V y 1.0 V; la tarjeta marca error si lee menos de –50 °C o más de 65 °C.",
   "Si el sensor mide mal, cámbialo. Si mide bien, revisa el cableado y, al final, la tarjeta main."];
  if(extra)a.push(extra); return a;
}
function fixFan(extra){
  var a=["Desconecta el equipo y revisa que no haya hielo ni objetos que traben las aspas; descongela si hace falta.",
   "Revisa cableado, conector y el interruptor de puerta (si aplica).",
   "Con el equipo conectado mide la alimentación del motor (unos 12 VDC) y la señal de retroalimentación (unos 2.6 VDC).",
   "Si no gira con voltaje correcto, cambia el ventilador; si falta el voltaje, revisa la tarjeta main."];
  if(extra)a.push(extra); return a;
}
function fixDefrost(val){
  return ["Haz un deshielo forzado (modo Fd / rd) desde el autodiagnóstico y mide unos 120 VAC en el calefactor.",
   "Desconecta y mide el calefactor, el bimetal y el fusible térmico: "+val+".",
   "Cambia la pieza abierta; si todo mide bien, cambia la tarjeta main.",
   "Si hay mucha escarcha, descongela por completo el equipo antes de volver a probar."];
}
var VOLT_FIX=["Desconecta el refrigerador (o baja el breaker) 60 s y vuelve a conectar.","Mide el voltaje del contacto: debe ser estable y correcto (115 V).","Evita extensiones y conecta directo a la pared; considera un regulador o protector de voltaje.","Si el código regresa, revisa la tarjeta main/inverter y el compresor."];
var COMP_FIX=function(x){return ["Desconecta el equipo 10 min y vuelve a conectar.","Revisa el conector del inverter, posibles cortos y soldaduras de la tarjeta inverter.",x,"Si el inverter y el voltaje están bien y el código sigue, cambia el compresor; si no, cambia la tarjeta inverter."]};

function E(n,alias,g,nombre,d,r){return {c:n+'E',a:alias,g:g,n:nombre,d:d,r:r}}
function NODOC(n){return {c:n+'E',a:n+'C',g:"Sin documentar",n:"Sin significado documentado",
 d:"Este número no tiene un significado publicado en las fuentes consultadas (soporte de Samsung, manuales de servicio y guías técnicas). Puede ser propio de un modelo o de una serie.",
 r:["Anota el código exacto y el modelo completo (etiqueta interior).","Desconecta el equipo 60 s y reconecta para ver si regresa.","Consulta el manual de servicio de ese modelo en el centro de descargas de Samsung.","Si persiste, solicita servicio."]}}

/* ============================================================ */
var view=document.getElementById('view'), ttl=document.getElementById('ttl'), sub=document.getElementById('sub'), backBtn=document.getElementById('back');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function setHeader(t,s,back){ttl.textContent=t;sub.textContent=s||'Redsa Service';backBtn.style.display=back?'flex':'none';window.scrollTo(0,0)}
function go(h){ if(location.hash!==h){location.hash=h}else{render()} }
backBtn.onclick=function(){history.back()};
document.getElementById('theme').onclick=cambiarTema;
aplicarTema();
window.addEventListener('hashchange',render);

function codeItem(x){
  var k=norm(x.c+' '+x.a).replace(/[^a-z0-9 ]/g,' ');
  return '<details data-k=" '+esc(k)+' " data-s="'+esc(norm(x.c+' '+x.a+' '+x.n+' '+x.d+' '+x.g))+'" data-g="'+esc(x.g)+'">'+
   '<summary><span class="code">'+esc(x.c)+'</span><span>'+esc(x.n)+'<small>'+esc(x.g)+(x.a?' · '+esc(x.a):'')+'</small></span></summary>'+
   '<div class="body"><h4>Significado</h4><p>'+x.d+'</p><h4>Cómo resolverlo</h4><ol>'+x.r.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ol></div></details>';
}

function renderHome(){
  setHeader('Códigos de error Samsung','Redsa Service',false);
  var h='<div class="hero"><img src="'+LOGO+'" alt="Redsa Service"><h2>Códigos de error Samsung</h2><p>Elige el tipo de refrigerador</p></div><div class="grid">';
  CATS.forEach(function(c){
    h+='<button class="card" onclick="go(\'#/t/'+c.id+'\')">'+fridgeSvg(c.id)+'<b>'+esc(c.nombre)+'</b><span class="s">'+esc(c.sub)+'</span></button>';
  });
  h+='</div><button class="btn" onclick="go(\'#/todos\')">Lista de todos los códigos de error</button>';
  view.innerHTML=h;
}

function renderCat(id){
  var c=CATS.filter(function(x){return x.id===id})[0]; if(!c){return go('#/')}
  setHeader(c.nombre,'Modo de autodiagnóstico',true);
  var h='<div class="catpic">'+fridgeSvg(c.id)+'</div><h3>Cómo hacer el autodiagnóstico</h3>';
  c.variantes.forEach(function(v,i){
    h+='<details'+(i===0?' open':'')+'><summary><span>'+esc(v.t)+(v.m?'<small>'+esc(v.m)+'</small>':'')+'</span></summary><div class="body"><ol>'+v.pasos.map(function(p){return '<li>'+p+'</li>'}).join('')+'</ol>'+(v.salir?'<h4>Para salir</h4><p>'+v.salir+'</p>':'')+'</div></details>';
  });
  h+='<button class="btn" onclick="go(\'#/c/'+c.id+'\')">Ver códigos de error →</button>';
  view.innerHTML=h;
}

function renderCodes(id){
  var c=CATS.filter(function(x){return x.id===id})[0]; if(!c){return go('#/')}
  setHeader('Códigos · '+c.nombre,'',true);
  renderList(CODES.filter(function(x){return !x.ap||x.ap.indexOf(c.id)>-1}));
}
function renderTodos(){ setHeader('Todos los códigos','Significado y cómo resolverlos',true); renderList(CODES); }

function renderList(list){
  var groups=GROUP_ORDER.filter(function(g){return list.some(function(x){return x.g===g})});
  var h='<input class="search" id="q" type="search" placeholder="Buscar código o palabra (p. ej. 22E, ventilador)" autocomplete="off">';
  h+='<div class="chips" id="chips"><button class="chip on" data-g="">Todos</button>'+groups.map(function(g){return '<button class="chip" data-g="'+esc(g)+'">'+esc(g)+'</button>'}).join('')+'</div>';
  h+='<div id="list">'+list.map(codeItem).join('')+'</div><div class="empty" id="empty" style="display:none">Sin resultados.</div>';
  view.innerHTML=h;
  var q=document.getElementById('q'), chips=document.getElementById('chips'), g='';
  function filter(){
    var t=norm(q.value).trim(), n=0;
    Array.prototype.forEach.call(document.querySelectorAll('#list details'),function(d){
      var hit=!t||(/^[0-9]{1,3}[ec]$/.test(t)?d.getAttribute('data-k').indexOf(' '+t+' ')>-1:d.getAttribute('data-s').indexOf(t)>-1);
      var ok=(!g||d.getAttribute('data-g')===g)&&hit;
      d.style.display=ok?'':'none'; if(ok)n++;
    });
    document.getElementById('empty').style.display=n?'none':'block';
  }
  q.addEventListener('input',filter);
  chips.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b)return;
    Array.prototype.forEach.call(chips.children,function(x){x.classList.remove('on')});
    b.classList.add('on'); g=b.getAttribute('data-g'); filter();
  });
}

function render(){
  var h=location.hash||'#/', m;
  if((m=h.match(/^#\/t\/(\w+)$/))) return renderCat(m[1]);
  if((m=h.match(/^#\/c\/(\w+)$/))) return renderCodes(m[1]);
  if(h==='#/todos') return renderTodos();
  renderHome();
}
render();
</script>
